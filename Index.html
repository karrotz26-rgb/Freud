<!DOCTYPE html>
<html>
<head>
    <title>Super Sigmund Bros</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #222; }
    </style>
</head>
<body>

<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: {
            default: 'arcade',
            arcade: { gravity: { y: 400 }, debug: false }
        },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let platforms;
    let cursors;

    function preload() {
        // Load the Victorian Library environment assets
        this.load.image('library', 'library_bg.png'); // Your separated 800x600 background
        this.load.image('shelf', 'wood_shelf.png');   // Your separated platform strip

        // Your existing Freud sprite
        this.load.spritesheet('freud', 'freud_spritesheet.png', { frameWidth: 32, frameHeight: 32 });
    }

    function create() {
        // 1. Draw the background FIRST (at the center of the 800x600 screen)
        this.add.image(400, 300, 'library');

        // 2. Build the platforms using the new 'shelf' image
        platforms = this.physics.add.staticGroup();
        // The main floor
        platforms.create(400, 584, 'shelf').setScale(2).refreshBody();
        // Floating shelves
        platforms.create(600, 400, 'shelf');
        platforms.create(50, 250, 'shelf');
        platforms.create(750, 220, 'shelf');

        // 3. Spawning Freud and Animations (Kept from previous steps)
        player = this.physics.add.sprite(100, 450, 'freud');
        player.setBounce(0.1);
        player.setCollideWorldBounds(true);
        this.physics.add.collider(player, platforms);

        this.anims.create({
            key: 'right',
            frames: this.anims.generateFrameNumbers('freud', { start: 1, end: 4 }),
            frameRate: 10, repeat: -1
        });

        this.anims.create({
            key: 'left',
            frames: this.anims.generateFrameNumbers('freud', { start: 7, end: 10 }),
            frameRate: 10, repeat: -1
        });

        this.anims.create({
            key: 'turn',
            frames: [ { key: 'freud', frame: 0 } ],
            frameRate: 20
        });

        cursors = this.input.keyboard.createCursorKeys();
    }

    function update() {
        if (cursors.left.isDown) {
            player.setVelocityX(-200);
            player.anims.play('left', true);
        } 
        else if (cursors.right.isDown) {
            player.setVelocityX(200);
            player.anims.play('right', true);
        } 
        else {
            player.setVelocityX(0);
            player.anims.play('turn');
        }

        if (cursors.up.isDown && player.body.touching.down) {
            player.setVelocityY(-400);
        }
    }
</script>

</body>
</html>
