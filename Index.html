<!DOCTYPE html>
<html>
<head>
    <title>Super Sigmund Bros</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #222; }
    </style>
</head>
<body>

<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: {
            default: 'arcade',
            arcade: { gravity: { y: 400 }, debug: false }
        },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let platforms;
    let cursors;

    function preload() {
        this.load.image('ground', 'https://labs.phaser.io/assets/sprites/platform.png');
        // Loading the local Freud spritesheet
        this.load.spritesheet('freud', 'watermarked_img_1034293984487268144.jpg', { frameWidth: 32, frameHeight: 32 });
    }

    function create() {
        platforms = this.physics.add.staticGroup();
        platforms.create(400, 584, 'ground').setScale(2).refreshBody();
        platforms.create(600, 400, 'ground');
        platforms.create(50, 250, 'ground');
        platforms.create(750, 220, 'ground');

        player = this.physics.add.sprite(100, 450, 'freud');
        player.setBounce(0.1);
        player.setCollideWorldBounds(true);
        this.physics.add.collider(player, platforms);

        // --- ANIMATIONS ---
        this.anims.create({
            key: 'right',
            frames: this.anims.generateFrameNumbers('freud', { start: 1, end: 4 }),
            frameRate: 10,
            repeat: -1 // -1 means it loops forever
        });

        this.anims.create({
            key: 'left',
            frames: this.anims.generateFrameNumbers('freud', { start: 7, end: 10 }),
            frameRate: 10,
            repeat: -1
        });

        this.anims.create({
            key: 'turn',
            frames: [ { key: 'freud', frame: 0 } ],
            frameRate: 20
        });

        cursors = this.input.keyboard.createCursorKeys();
    }

    function update() {
        if (cursors.left.isDown) {
            player.setVelocityX(-200);
            player.anims.play('left', true); // Play left animation
        } 
        else if (cursors.right.isDown) {
            player.setVelocityX(200);
            player.anims.play('right', true); // Play right animation
        } 
        else {
            player.setVelocityX(0);
            player.anims.play('turn'); // Play idle frame
        }

        if (cursors.up.isDown && player.body.touching.down) {
            player.setVelocityY(-400);
        }
    }
</script>

</body>
</html>
