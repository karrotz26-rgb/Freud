<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Super Sigmund Bros</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #222; touch-action: none; }
        #game-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="game-container"></div>

<script>
    const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: 800,
        height: 600,
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        // Two fingers at once (e.g. move + jump together) needs more than the default 1 pointer
        input: { activePointers: 3 },
        physics: {
            default: 'arcade',
            arcade: { gravity: { y: 400 }, debug: false }
        },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let player;
    let platforms;
    let cursors;
    let jumpKey;
    let touchLeft = false;
    let touchRight = false;
    let touchJump = false;
    let collectibles;
    let score = 0;
    let scoreText;
    let timerText;
    let timeLeft = 30;
    let spawnTimerEvent;
    let countdownEvent;
    let gameState = 'start'; // 'start' -> 'playing' -> 'gameover'
    let startScreen;
    let gameOverScreen;
    let finalScoreText;
    let highScoreText;

    // Cigar is common and cheap, book is uncommon and worth more, watch is rare
    // and worth the most - weights are relative, they don't need to sum to 100.
    const COLLECTIBLE_TYPES = [
        { key: 'cigar', points: 1, weight: 70 },
        { key: 'book', points: 5, weight: 25 },
        { key: 'watch', points: 10, weight: 5 }
    ];
    const ITEM_SCALE = 0.24; // ~47px tall on screen
    const ITEM_HALF_HEIGHT = 197 * ITEM_SCALE / 2;
    const MAX_COLLECTIBLES = 6;
    const COLLECTIBLE_LIFESPAN = 6000; // ms an uncollected item stays on screen
    const ROUND_SECONDS = 30;
    const HIGH_SCORE_KEY = 'freudHighScores';
    const MAX_HIGH_SCORES = 5;

    // Random spawn spots along the top surface of each platform, so items always
    // appear somewhere Freud can actually walk or jump up to reach.
    const SPAWN_ZONES = [
        { xMin: 20, xMax: 780, top: 558 },  // main floor
        { xMin: 500, xMax: 700, top: 388 }, // middle-right shelf
        { xMin: 50, xMax: 250, top: 398 },  // step shelf
        { xMin: 5, xMax: 150, top: 238 },   // top-left shelf
        { xMin: 650, xMax: 795, top: 208 }  // top-right shelf
    ];

    function pickCollectibleType() {
        const totalWeight = COLLECTIBLE_TYPES.reduce((sum, t) => sum + t.weight, 0);
        let r = Math.random() * totalWeight;
        for (const t of COLLECTIBLE_TYPES) {
            if (r < t.weight) return t;
            r -= t.weight;
        }
        return COLLECTIBLE_TYPES[0];
    }

    function spawnCollectible() {
        if (collectibles.countActive(true) >= MAX_COLLECTIBLES) return;

        const zone = Phaser.Utils.Array.GetRandom(SPAWN_ZONES);
        const type = pickCollectibleType();
        const x = Phaser.Math.Between(zone.xMin, zone.xMax);
        const y = zone.top - ITEM_HALF_HEIGHT - 6;

        const item = collectibles.create(x, y, 'collectables', type.key);
        item.body.setAllowGravity(false);
        item.setData('points', type.points);

        // Pop into the screen: grow from nothing with a little overshoot
        item.setScale(0);
        this.tweens.add({
            targets: item,
            scale: ITEM_SCALE,
            duration: 300,
            ease: 'Back.Out'
        });

        // Disappear on its own after a while if nobody collects it
        item.setData('expireTimer', this.time.delayedCall(COLLECTIBLE_LIFESPAN, () => removeItem.call(this, item)));
    }

    // Shared pop-off (shrink + fade, then remove) used by both collection and expiry
    function removeItem(item) {
        if (item.getData('collected')) return; // already being removed by the other path
        item.setData('collected', true);
        item.body.enable = false;

        this.tweens.add({
            targets: item,
            scale: 0,
            alpha: 0,
            duration: 250,
            ease: 'Back.In',
            onComplete: () => item.destroy()
        });
    }

    function collectItem(playerObj, item) {
        if (item.getData('collected')) return; // avoid double-collecting the same frame

        const expireTimer = item.getData('expireTimer');
        if (expireTimer) expireTimer.remove(false);

        score += item.getData('points');
        scoreText.setText('Score: ' + score);

        removeItem.call(this, item);
    }

    // High scores are kept in this browser only (localStorage) - there's no
    // server here to share a leaderboard across players.
    function loadHighScores() {
        try {
            const raw = JSON.parse(localStorage.getItem(HIGH_SCORE_KEY));
            return Array.isArray(raw) ? raw : [];
        } catch (e) {
            return [];
        }
    }

    function saveHighScore(newScore) {
        const scores = loadHighScores();
        scores.push(newScore);
        scores.sort((a, b) => b - a);
        const top = scores.slice(0, MAX_HIGH_SCORES);
        try { localStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(top)); } catch (e) { /* storage unavailable, ignore */ }
        return top;
    }

    function startGame() {
        gameState = 'playing';

        score = 0;
        scoreText.setText('Score: 0');
        timeLeft = ROUND_SECONDS;
        timerText.setText('Time: ' + timeLeft);

        player.setPosition(100, 450);
        player.setVelocity(0, 0);

        // Cancel any pending expiry timers before wiping leftover items from a previous round
        collectibles.getChildren().slice().forEach(item => {
            const t = item.getData('expireTimer');
            if (t) t.remove(false);
        });
        collectibles.clear(true, true);

        startScreen.setVisible(false);
        gameOverScreen.setVisible(false);

        spawnCollectible.call(this);
        spawnTimerEvent = this.time.addEvent({ delay: 2000, callback: spawnCollectible, callbackScope: this, loop: true });
        countdownEvent = this.time.addEvent({
            delay: 1000, loop: true, callbackScope: this,
            callback: () => {
                timeLeft--;
                timerText.setText('Time: ' + timeLeft);
                if (timeLeft <= 0) endGame.call(this);
            }
        });
    }

    function endGame() {
        gameState = 'gameover';

        if (spawnTimerEvent) spawnTimerEvent.remove();
        if (countdownEvent) countdownEvent.remove();

        const scores = saveHighScore(score);
        finalScoreText.setText('Score: ' + score);
        highScoreText.setText(
            'High Scores\n' + scores.map((s, i) => (i + 1) + '. ' + s).join('\n')
        );
        gameOverScreen.setVisible(true);
    }

    function preload() {
        // Load the Victorian Library environment assets
        this.load.image('library', 'library_bg.png'); // Actual size 2400x1792, scaled to fit at draw time

        // wood_shelf.png is a sheet with 3 assets (plain shelf, bookshelf, book stack);
        // we only use the plain shelf region (see the frame carved out below).
        this.load.image('shelfSheet', 'wood_shelf.png');

        // Collectables.png has cigar/watch/book already isolated side by side
        this.load.image('collectables', 'Collectables.png');

        // Your existing Freud sprite (actual sheet is a 6-col x 2-row grid of 107x194 frames)
        this.load.spritesheet('freud', 'freud_spritesheet.png', { frameWidth: 107, frameHeight: 194 });
    }

    function create() {
        // 1. Draw the background FIRST, scaled to fill the 800x600 screen
        this.add.image(400, 300, 'library').setDisplaySize(800, 600);

        // 2. Carve the plain-shelf region out of the uploaded sheet (x:80,y:88, 1219x129)
        this.textures.get('shelfSheet').add('shelf', 0, 80, 88, 1219, 129);

        // Carve the cigar/watch/book icons out of the uploaded collectables sheet
        const ctex = this.textures.get('collectables');
        ctex.add('cigar', 0, 39, 100, 135, 197);
        ctex.add('watch', 0, 220, 100, 121, 197);
        ctex.add('book', 0, 380, 100, 169, 197);

        // The auto-sliced running frame (index 2, x:214-321) had the tail end of
        // the previous pose bleeding into its left ~25px, since the character art
        // isn't neatly confined to the sheet's even 107px grid columns. Carve out
        // a tighter frame that starts past the bleed.
        this.textures.get('freud').add('run', 0, 239, 0, 82, 194);

        // 3. Build the platforms using the carved 'shelf' frame
        platforms = this.physics.add.staticGroup();
        // The main floor - spans the full canvas width so there's no gap at the
        // edges where the player would rest on the invisible world bound instead
        // of the actual floor (which caused walking into it to feel like hitting a wall)
        platforms.create(400, 584, 'shelfSheet', 'shelf').setDisplaySize(800, 52).refreshBody();
        // Floating shelves
        platforms.create(600, 400, 'shelfSheet', 'shelf').setScale(0.18).refreshBody();
        // Stepping-stone shelf: bridges the floor to the top-left shelf, which is
        // otherwise a ~320px drop below it, well past Freud's ~200px jump height.
        // Approach it (and the top-left shelf after it) by running in from the
        // side and jumping, not straight up from underneath - jumping straight
        // up into the underside of a platform blocks the jump instead of landing.
        platforms.create(150, 410, 'shelfSheet', 'shelf').setScale(0.18).refreshBody();
        platforms.create(50, 250, 'shelfSheet', 'shelf').setScale(0.18).refreshBody();
        platforms.create(750, 220, 'shelfSheet', 'shelf').setScale(0.18).refreshBody();

        // 4. Spawning Freud and Animations (Kept from previous steps)
        player = this.physics.add.sprite(100, 450, 'freud');
        player.setScale(0.6); // Sprite frames are 107x194; scale down to fit the scene
        player.setBounce(0);
        player.setCollideWorldBounds(true);
        player.setMaxVelocity(220, 800);
        // The character art only fills rows 42-160 of each 194px-tall frame - the
        // rest is transparent padding. Using the full frame as the hitbox left the
        // body's bottom (and so his resting height) well below his actual feet,
        // making him hover above platforms. Trim the body to the visible region.
        player.body.setSize(107, 118).setOffset(0, 42);
        this.physics.add.collider(player, platforms);

        cursors = this.input.keyboard.createCursorKeys();
        jumpKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

        // 5. Collectibles: cigar (common, 1pt), book (uncommon, 5pts), watch (rare, 10pts).
        // Spawning/timer only start once the player clicks Start (see startGame()).
        collectibles = this.physics.add.group();
        this.physics.add.overlap(player, collectibles, collectItem, null, this);

        scoreText = this.add.text(16, 16, 'Score: 0', {
            fontSize: '24px', fontFamily: 'Georgia, serif', color: '#f5e6c8',
            stroke: '#2b1a0f', strokeThickness: 4
        }).setDepth(100);

        timerText = this.add.text(784, 16, 'Time: ' + ROUND_SECONDS, {
            fontSize: '24px', fontFamily: 'Georgia, serif', color: '#f5e6c8',
            stroke: '#2b1a0f', strokeThickness: 4
        }).setOrigin(1, 0).setDepth(100);

        // 6. Start screen - click anywhere on the overlay to begin
        const startOverlay = this.add.rectangle(400, 300, 800, 600, 0x000000, 0.6)
            .setInteractive({ useHandCursor: true })
            .on('pointerdown', () => startGame.call(this));
        const startTitle = this.add.text(400, 230, 'Super Sigmund Bros', {
            fontSize: '40px', fontFamily: 'Georgia, serif', color: '#f5e6c8',
            stroke: '#2b1a0f', strokeThickness: 6
        }).setOrigin(0.5);
        const startPrompt = this.add.text(400, 300, 'Click to Start\n30 seconds to collect as much as you can!', {
            fontSize: '20px', fontFamily: 'Georgia, serif', color: '#f5e6c8', align: 'center'
        }).setOrigin(0.5);
        startScreen = this.add.container(0, 0, [startOverlay, startTitle, startPrompt]).setDepth(200);

        // 7. Game over screen - hidden until the round ends
        const gameOverOverlay = this.add.rectangle(400, 300, 800, 600, 0x000000, 0.75)
            .setInteractive({ useHandCursor: true })
            .on('pointerdown', () => startGame.call(this));
        const gameOverTitle = this.add.text(400, 190, "Time's Up!", {
            fontSize: '36px', fontFamily: 'Georgia, serif', color: '#f5e6c8',
            stroke: '#2b1a0f', strokeThickness: 6
        }).setOrigin(0.5);
        finalScoreText = this.add.text(400, 240, 'Score: 0', {
            fontSize: '24px', fontFamily: 'Georgia, serif', color: '#f5e6c8'
        }).setOrigin(0.5);
        highScoreText = this.add.text(400, 340, 'High Scores', {
            fontSize: '20px', fontFamily: 'Georgia, serif', color: '#f5e6c8', align: 'center', lineSpacing: 6
        }).setOrigin(0.5);
        const playAgainPrompt = this.add.text(400, 470, 'Click to Play Again', {
            fontSize: '20px', fontFamily: 'Georgia, serif', color: '#f5e6c8'
        }).setOrigin(0.5);
        gameOverScreen = this.add.container(0, 0,
            [gameOverOverlay, gameOverTitle, finalScoreText, highScoreText, playAgainPrompt]
        ).setDepth(200).setVisible(false);

        // 8. On-screen touch controls, for phones/tablets. Sit below the start/
        // game-over overlays (depth 200) so those still capture taps everywhere
        // while a round isn't in progress; keyboard controls keep working too.
        const makeButton = (x, y, radius, label) => {
            const circle = this.add.circle(x, y, radius, 0xf5e6c8, 0.25)
                .setStrokeStyle(2, 0xf5e6c8, 0.6)
                .setScrollFactor(0)
                .setDepth(150)
                .setInteractive();
            this.add.text(x, y, label, {
                fontSize: (radius) + 'px', fontFamily: 'Georgia, serif', color: '#f5e6c8'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(151);
            return circle;
        };

        const leftBtn = makeButton(80, 515, 58, '<');
        const rightBtn = makeButton(220, 515, 58, '>');
        const jumpBtn = makeButton(710, 515, 70, '^');

        leftBtn.on('pointerdown', () => { touchLeft = true; });
        leftBtn.on('pointerup', () => { touchLeft = false; });
        leftBtn.on('pointerout', () => { touchLeft = false; });

        rightBtn.on('pointerdown', () => { touchRight = true; });
        rightBtn.on('pointerup', () => { touchRight = false; });
        rightBtn.on('pointerout', () => { touchRight = false; });

        jumpBtn.on('pointerdown', () => { touchJump = true; });
        jumpBtn.on('pointerup', () => { touchJump = false; });
        jumpBtn.on('pointerout', () => { touchJump = false; });
    }

    function update() {
        // Freeze controls on the start/game-over screens; only let Freud fall/settle
        if (gameState !== 'playing') {
            player.setAccelerationX(0);
            player.setDragX(600);
            return;
        }

        // Accelerate/decelerate instead of snapping velocity instantly, so movement feels smooth.
        // Keyboard and the on-screen touch buttons both feed into this.
        if (cursors.left.isDown || touchLeft) {
            player.setAccelerationX(-600);
        }
        else if (cursors.right.isDown || touchRight) {
            player.setAccelerationX(600);
        }
        else {
            player.setAccelerationX(0);
            player.setDragX(600);
        }

        // One static pose per state instead of a cycling animation, for maximum
        // stability: frame 0 standing still, the trimmed 'run' frame running,
        // frame 5 jumping. Facing direction (flipX) is tracked separately from
        // pose, and only updates when there's real horizontal intent, so it
        // doesn't reset to "facing right" every time he stops or jumps straight up.
        const vx = player.body.velocity.x;
        if (vx < -10) {
            player.setFlipX(true);
        } else if (vx > 10) {
            player.setFlipX(false);
        }

        if (!player.body.blocked.down) {
            player.setFrame(5);
        } else if (Math.abs(vx) > 10) {
            player.setFrame('run');
        } else {
            player.setFrame(0);
        }

        // Jump with Up Arrow, Space, or the on-screen jump button, only while
        // standing on a platform. blocked.down (not touching.down) is what
        // reliably reflects resting contact against a static body here.
        if ((cursors.up.isDown || jumpKey.isDown || touchJump) && player.body.blocked.down) {
            player.setVelocityY(-400);
        }
    }
</script>

</body>
</html>
